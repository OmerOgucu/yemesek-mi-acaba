services:
  minio:
    profiles: ["ci"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ciaccesskey
      MINIO_ROOT_PASSWORD: cisecretvalue123456
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mail:
    profiles: ["ci"]
    image: node:22-bookworm-slim
    command: ["node", "/opt/mail-sink.mjs"]
    volumes:
      - ./ops/ci/mail-sink.mjs:/opt/mail-sink.mjs:ro
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

  web-local:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/tls.crt
    volumes:
      - ./ops/state/ci-certs/tls.crt:/certs/tls.crt:ro

  edge-proxy:
    profiles: ["ci"]
    image: nginx:1.27-alpine
    volumes:
      - ./ops/ci/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/state/ci-certs:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    networks:
      internal:
        aliases:
          - api.yemesek.test
          - web.yemesek.test
    depends_on:
      api-local:
        condition: service_healthy
      web-local:
        condition: service_healthy
