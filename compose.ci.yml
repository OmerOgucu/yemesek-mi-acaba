services:
  minio:
    profiles: ["ci"]
    # Docker Hub removed minio/minio. This stand-in speaks S3 and is not production R2.
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-s3.port=9000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mail:
    profiles: ["ci"]
    image: node:22-bookworm-slim
    command: ["node", "/opt/mail-sink.mjs"]
    volumes:
      - ./ops/ci/mail-sink.mjs:/opt/mail-sink.mjs:ro
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal]

  web-local:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/tls.crt
    volumes:
      - ./ops/state/ci-certs/tls.crt:/certs/tls.crt:ro

  edge-proxy:
    profiles: ["ci"]
    image: nginx:1.27-alpine
    volumes:
      - ./ops/ci/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/state/ci-certs:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
    networks:
      internal:
        aliases:
          - api.yemesek.test
          - web.yemesek.test
    depends_on:
      api-local:
        condition: service_healthy
      web-local:
        condition: service_healthy
