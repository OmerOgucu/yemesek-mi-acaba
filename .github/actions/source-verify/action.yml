name: Source verify
description: Typecheck, tests, and image builds. Read-only. No production secrets.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - shell: sh
      run: sh ops/ci/verify-source.sh
